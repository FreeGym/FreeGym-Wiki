# Contributor Tracker
#
# This workflow automatically tracks contributors and their verification status.
# When someone's PR is merged, it updates contributors.yaml with:
# - Contributor info (join date, checkmark status, topics)
# - Detailed contributions (files, citation counts)
# - Aggregated stats (total citations)
#
# Verification logic:
# - Maintainers add the "substantive" label to PRs that count toward verification
# - A PR without this label is tracked but doesn't earn the checkmark
# - This keeps human judgment in the verification process
#
# Citation counting:
# - Counts unique linked sources in each article's reference section
# - A DOI, PubMed, PMC, and publisher link in the same entry count as one source
# - Edited files count only reference sources that were not present before the PR

name: Track Contributors

on:
  # Fork PRs get a read-only token on pull_request, so the tracker
  # cannot push the generated contributor-update PR after merge.
  # pull_request_target runs trusted workflow code from main.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process (required for manual runs)'
        required: true

jobs:
  track-contributor:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login != 'github-actions[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'skip-contributor-tracking')
      )
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml cairosvg

      - name: Use accumulated contributors.yaml if available
        run: |
          # If contributor-update/auto exists, use its contributors.yaml
          # to preserve accumulated updates from previous unmerged runs.
          # Without this, each force-push would overwrite previous updates.
          if git fetch origin contributor-update/auto 2>/dev/null; then
            git checkout origin/contributor-update/auto -- contributors.yaml 2>/dev/null && \
              echo "Using accumulated contributors.yaml from contributor-update/auto" || \
              echo "Branch exists but contributors.yaml checkout failed, using main"
          else
            echo "No existing contributor-update/auto branch, starting from main"
          fi

      - name: Get PR info and analyze contributions
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          python << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          import os
          import urllib.parse

          # Get PR info from environment
          pr_number_raw = os.environ.get("PR_NUMBER") or os.environ.get("PR_NUMBER_INPUT") or ""
          if not pr_number_raw:
              raise SystemExit("PR number not provided. Use workflow_dispatch input pr_number.")
          pr_number = int(pr_number_raw)
          author = os.environ.get("PR_AUTHOR", "")
          labels_json = os.environ.get("LABELS_JSON", "[]")
          github_output = os.environ.get("GITHUB_OUTPUT")

          def set_output(name, value):
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"{name}={value}\n")

          try:
              labels = json.loads(labels_json) if labels_json else []
          except json.JSONDecodeError:
              labels = []
          result = subprocess.run(
              [
                  "gh", "pr", "view", str(pr_number), "--json",
                  "author,labels,baseRefOid,headRefOid"
              ],
              capture_output=True, text=True
          )
          if result.returncode != 0 or not result.stdout.strip():
              raise SystemExit(f"Fatal: Could not read PR #{pr_number} metadata.")

          info = json.loads(result.stdout)
          if not author:
              author = info.get("author", {}).get("login", "")
          if not labels:
              labels = [l.get("name") for l in info.get("labels", []) if l.get("name")]
          base_sha = info.get("baseRefOid", "")
          head_sha = info.get("headRefOid", "")
          if not base_sha or not head_sha:
              raise SystemExit(f"Fatal: PR #{pr_number} base or head commit is unavailable.")

          service_accounts = {"FreeGym"}

          def infer_author_from_commits(pr_number, pr_author):
              """Use the lone human commit author when an org account opened the PR."""
              if pr_author not in service_accounts:
                  return pr_author

              result = subprocess.run(
                  ["gh", "pr", "view", str(pr_number), "--json", "commits"],
                  capture_output=True, text=True
              )
              if result.returncode != 0 or not result.stdout.strip():
                  raise SystemExit(
                      f"Fatal: PR #{pr_number} was opened by service account @{pr_author}, "
                      "but commit authors could not be read."
                  )

              info = json.loads(result.stdout)
              ignored = service_accounts | {"github-actions[bot]"}
              candidates = []
              for commit in info.get("commits", []) or []:
                  commit_authors = commit.get("authors", []) or []
                  if not commit_authors:
                      continue
                  # GitHub includes co-authors here. Use the primary commit
                  # author only so trailers do not create false ambiguity.
                  login = commit_authors[0].get("login")
                  if login and login not in ignored:
                      candidates.append(login)

              unique_candidates = sorted(set(candidates))
              if len(unique_candidates) == 1:
                  inferred = unique_candidates[0]
                  print(f"PR author @{pr_author} is a service account; crediting commit author @{inferred}.")
                  return inferred
              if not unique_candidates:
                  raise SystemExit(
                      f"Fatal: PR #{pr_number} was opened by service account @{pr_author}, "
                      "but no human GitHub commit author was found."
                  )
              raise SystemExit(
                  f"Fatal: PR #{pr_number} was opened by service account @{pr_author}, "
                  f"but multiple human commit authors were found: {', '.join(unique_candidates)}. "
                  "Process this PR manually to avoid misattribution."
              )

          author = infer_author_from_commits(pr_number, author)
          is_substantive = "substantive" in labels

          # Get list of files changed
          result = subprocess.run(
              ["gh", "pr", "diff", str(pr_number), "--name-only"],
              capture_output=True, text=True
          )
          all_files = result.stdout.strip().split('\n') if result.stdout.strip() else []

          # Filter to content markdown files only
          content_folders = ['nutrition', 'exercise', 'exercise-physiology', 'sleep', 'mental-health', 'supplements', 'recovery', 'Womens-Health', 'heart-health', 'cardiology', 'pharmacology', 'layman-version', 'biomarkers', 'wearables', 'musculoskeletal-health', 'dermatology', 'endocrinology']
          content_files = [f for f in all_files if any(f.startswith(folder + '/') for folder in content_folders) and f.endswith('.md')]

          if not content_files:
              set_output("has_content", "false")
              with open('pr_analysis.json', 'w') as f:
                  json.dump({
                      'author': author,
                      'pr_number': pr_number,
                      'is_substantive': is_substantive,
                      'topics': [],
                      'contributions': [],
                      'total_citations': 0,
                      'commits': 0
                  }, f)
              print("No content markdown files changed; skipping contributor update.")
              raise SystemExit(0)

          set_output("has_content", "true")

          # Get the full diff to analyze citations
          result = subprocess.run(
              ["gh", "pr", "diff", str(pr_number)],
              capture_output=True, text=True
          )
          full_diff = result.stdout

          # Fetch the immutable PR head so created/edited files can be compared
          # against the exact base commit, even after the PR has been merged.
          result = subprocess.run(
              ["git", "fetch", "--no-tags", "origin", f"pull/{pr_number}/head"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              raise SystemExit(
                  f"Fatal: Could not fetch the head of PR #{pr_number}: "
                  f"{result.stderr.strip()}"
              )
          fetched_head = subprocess.run(
              ["git", "rev-parse", "FETCH_HEAD"],
              capture_output=True, text=True, check=True
          ).stdout.strip()
          if fetched_head != head_sha:
              raise SystemExit(
                  f"Fatal: PR #{pr_number} head changed while it was being analyzed."
              )

          result = subprocess.run(
              ["git", "cat-file", "-e", f"{base_sha}^{{commit}}"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              result = subprocess.run(
                  ["git", "fetch", "--no-tags", "origin", base_sha],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f"Fatal: Could not fetch the base of PR #{pr_number}: "
                      f"{result.stderr.strip()}"
                  )

          def git_show(commit, filepath):
              """Return a file at a commit, or None when it did not exist."""
              result = subprocess.run(
                  ["git", "show", f"{commit}:{filepath}"],
                  capture_output=True, text=True, encoding="utf-8", errors="replace"
              )
              return result.stdout if result.returncode == 0 else None

          def reference_entries(markdown):
              """Extract individual entries from an H2 reference section."""
              if not markdown:
                  return [], False
              heading = re.search(
                  r"(?im)^##\s+(?:(?:selected|key)\s+)?references?\s*$",
                  markdown
              )
              if not heading:
                  return [], False

              section = markdown[heading.end():]
              next_heading = re.search(r"(?m)^##\s+", section)
              if next_heading:
                  section = section[:next_heading.start()]

              entries = []
              current = []
              bullet = re.compile(r"^\s*(?:[-*+]|\d+[.)])\s+(.*)$")
              for line in section.splitlines():
                  match = bullet.match(line)
                  if match:
                      if current:
                          entries.append("\n".join(current).strip())
                      current = [match.group(1)]
                  elif current and line.strip():
                      current.append(line.strip())
                  elif current:
                      entries.append("\n".join(current).strip())
                      current = []
              if current:
                  entries.append("\n".join(current).strip())

              if not entries:
                  entries = [
                      block.strip()
                      for block in re.split(r"\n\s*\n", section)
                      if block.strip()
                  ]
              return entries, True

          def clean_doi(value):
              value = value.replace(r"\(", "(").replace(r"\)", ")").strip()
              value = value.rstrip(".,;:")
              while value.endswith(")") and value.count("(") < value.count(")"):
                  value = value[:-1]
              return value.lower()

          def normalize_url(value):
              value = value.replace(r"\(", "(").replace(r"\)", ")").strip()
              value = value.rstrip(".,;:'\"")
              while value.endswith(")") and value.count("(") < value.count(")"):
                  value = value[:-1]
              try:
                  parts = urllib.parse.urlsplit(value)
              except ValueError:
                  return value.lower()
              path = parts.path.rstrip("/") or "/"
              return urllib.parse.urlunsplit(
                  (parts.scheme.lower(), parts.netloc.lower(), path, parts.query, "")
              )

          def linked_urls(entry):
              urls = []
              # Markdown targets may contain escaped parentheses.
              for target in re.findall(r"\]\((https?://(?:\\.|[^)])+)\)", entry):
                  urls.append(target.strip().split()[0])
              # Also support autolinks and bare URLs.
              urls.extend(re.findall(r"https?://[^\s<>\"']+", entry))
              return {normalize_url(url) for url in urls if url}

          def source_ids(entry):
              """Return every stable identifier carried by one linked source."""
              urls = linked_urls(entry)
              if not urls:
                  return set()

              unescaped = urllib.parse.unquote(
                  entry.replace(r"\(", "(").replace(r"\)", ")")
              )
              identifiers = {f"url:{url}" for url in urls}

              for doi in re.findall(
                  r"\b10\.\d{4,9}/[-._;()/:A-Z0-9]+",
                  unescaped,
                  re.IGNORECASE
              ):
                  identifiers.add(f"doi:{clean_doi(doi)}")

              for pmid in re.findall(
                  r"(?:PMID\s*:?\s*(?:\[\s*)?|pubmed\.ncbi\.nlm\.nih\.gov/)(\d+)",
                  unescaped,
                  re.IGNORECASE
              ):
                  identifiers.add(f"pmid:{pmid}")

              for pmc in re.findall(
                  r"(?:PMC\s*:?\s*|pmc\.ncbi\.nlm\.nih\.gov/articles/)(PMC\d+)",
                  unescaped,
                  re.IGNORECASE
              ):
                  identifiers.add(f"pmc:{pmc.upper()}")

              return identifiers

          def source_groups(entries):
              """Merge entries that share any DOI, PMID, PMC ID, or URL."""
              groups = []
              for entry in entries:
                  identifiers = source_ids(entry)
                  if not identifiers:
                      continue
                  overlapping = [
                      index for index, group in enumerate(groups)
                      if group & identifiers
                  ]
                  if not overlapping:
                      groups.append(set(identifiers))
                      continue
                  merged = set(identifiers)
                  for index in reversed(overlapping):
                      merged.update(groups.pop(index))
                  groups.append(merged)
              return groups

          # Analyze each content file
          contributions = []
          total_citations = 0

          for filepath in content_files:
              base_text = git_show(base_sha, filepath)
              head_text = git_show(head_sha, filepath)
              if head_text is None:
                  # Deleted content is not a contributor-card addition.
                  continue
              file_type = "created" if base_text is None else "edit"

              # Get just the additions for this file from the diff
              in_file = False
              file_additions = []
              for line in full_diff.split('\n'):
                  if line.startswith('diff --git'):
                      in_file = filepath in line
                  elif in_file and line.startswith('+') and not line.startswith('+++'):
                      file_additions.append(line[1:])  # Remove the + prefix

              # Count a reference entry once even when it contains several
              # representations of the same paper (for example DOI + PMID +
              # publisher URL). Repeated links in article prose are ignored.
              head_entries, has_reference_section = reference_entries(head_text)
              if has_reference_section:
                  head_groups = source_groups(head_entries)
                  base_entries, _ = reference_entries(base_text)
                  base_groups = source_groups(base_entries)
                  citations_added = sum(
                      1 for group in head_groups
                      if not any(group & old_group for old_group in base_groups)
                  )
              else:
                  # Older articles without a reference section retain a
                  # conservative additions-only fallback, still deduplicated
                  # by source identity rather than URL category.
                  citations_added = len(source_groups(file_additions))

              # Determine if this is a major edit (significant citations or new content)
              if file_type == "edit" and (citations_added >= 3 or len(file_additions) >= 20):
                  file_type = "major_edit"

              contributions.append({
                  'file': filepath,
                  'type': file_type,
                  'citations_added': citations_added
              })
              total_citations += citations_added

          # Get topics from folders using canonical topic keys
          topic_aliases = {
              "heart-health": "cardiology"
          }
          all_topics = []
          seen_topics = set()
          for filepath in content_files:
              if '/' not in filepath:
                  continue
              topic = topic_aliases.get(filepath.split('/', 1)[0], filepath.split('/', 1)[0])
              if topic not in seen_topics:
                  seen_topics.add(topic)
                  all_topics.append(topic)
          topics = all_topics if is_substantive else []

          # Count commits in this PR
          result = subprocess.run(
              ["gh", "pr", "view", str(pr_number), "--json", "commits", "--jq", ".commits | length"],
              capture_output=True, text=True
          )
          commits_in_pr = int(result.stdout.strip()) if result.stdout.strip().isdigit() else 1

          # Output results
          output = {
              'author': author,
              'pr_number': pr_number,
              'is_substantive': is_substantive,
              'topics': topics,
              'contributions': contributions,
              'total_citations': total_citations,
              'commits': commits_in_pr
          }

          # Write to file for next step
          with open('pr_analysis.json', 'w') as f:
              json.dump(output, f)

          print(f"Author: {author}")
          print(f"Substantive: {is_substantive}")
          print(f"Topics: {topics}")
          print(f"Files: {len(contributions)}")
          print(f"Citations: {total_citations}")
          print(f"Commits: {commits_in_pr}")
          
          # Force fail if author is missing to prevent attributing to the repo owner
          if not author:
              raise SystemExit("Fatal: Could not determine PR author.")

          PYTHON_SCRIPT

      - name: Update contributors.yaml
        if: steps.analyze.outputs.has_content == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'PYTHON_SCRIPT'
          import yaml
          import json
          import subprocess
          from datetime import datetime

          # Load analysis results
          with open('pr_analysis.json', 'r') as f:
              analysis = json.load(f)

          author = analysis['author']
          pr_number = analysis['pr_number']
          is_substantive = analysis['is_substantive']
          topics = analysis.get('topics') or []
          contributions = analysis.get('contributions') or []
          total_citations = analysis['total_citations']
          commits = analysis.get('commits', 1)
          current_month = datetime.now().strftime("%Y-%m")
          topic_aliases = {
              'heart-health': 'cardiology'
          }

          def normalize_topics(values):
              normalized = []
              seen = set()
              for value in values or []:
                  canonical = topic_aliases.get(value, value)
                  if canonical and canonical not in seen:
                      seen.add(canonical)
                      normalized.append(canonical)
              return normalized

          def get_absolute_commit_count(github_username):
              """Get total commit count for a user from the GitHub search API.
              Returns an absolute number, not incremental, so stale base
              values can never propagate."""
              try:
                  result = subprocess.run(
                      ["gh", "api", "--method", "GET", "search/commits",
                       "-f", f"q=author:{github_username} repo:FreeGym/FreeGym-Wiki",
                       "--jq", ".total_count"],
                      capture_output=True, text=True, timeout=30
                  )
                  if result.returncode == 0 and result.stdout.strip().isdigit():
                      return int(result.stdout.strip())
              except Exception:
                  pass
              return None

          # Load contributors.yaml
          with open('contributors.yaml', 'r') as f:
              data = yaml.safe_load(f) or {}

          for section_name in ('maintainers', 'trusted', 'contributors'):
              for entry in data.get(section_name, []) or []:
                  if isinstance(entry, dict):
                      entry['topics'] = normalize_topics(entry.get('topics') or [])

          # Helper to update a contributor record
          def update_contributor(contributor, is_new=False):
              contributor['last_active'] = current_month

              # Update topics
              existing_topics = contributor.get('topics') or []
              contributor['topics'] = normalize_topics(existing_topics + topics)

              # Update contributions list
              existing_contributions = contributor.get('contributions') or []
              for contrib in contributions:
                  contrib['pr'] = pr_number
                  existing_contributions.append(contrib)
              contributor['contributions'] = existing_contributions

              # Recalculate total_citations from contributions list (idempotent)
              contributor['total_citations'] = sum(
                  c.get('citations_added', 0) for c in contributor.get('contributions', [])
              )

              # Use absolute commit count from GitHub API instead of
              # incrementing.  This prevents stale base values (e.g. from
              # the accumulated branch) from propagating.
              github_user = contributor.get('github', author)
              abs_commits = get_absolute_commit_count(github_user)
              if abs_commits is not None:
                  contributor['commits'] = abs_commits
              else:
                  # Fallback: increment (less accurate but better than nothing)
                  contributor['commits'] = contributor.get('commits', 0) + commits

              return contributor

          # Check if author is a maintainer
          maintainers = data.get('maintainers') or []
          trusted = data.get('trusted') or []
          data['maintainers'] = maintainers
          data['trusted'] = trusted
          maintainer_names = [m['github'] for m in maintainers if isinstance(m, dict)]
          trusted_names = [t['github'] for t in trusted if isinstance(t, dict)]

          if author in maintainer_names:
              for m in maintainers:
                  if isinstance(m, dict) and m.get('github') == author:
                      update_contributor(m)
              print(f"Updated maintainer {author}")

          elif author in trusted_names:
              for t in trusted:
                  if isinstance(t, dict) and t.get('github') == author:
                      update_contributor(t)
                      t['prs_merged'] = t.get('prs_merged', 0) + 1
                      if is_substantive:
                          t['substantive_prs'] = t.get('substantive_prs', 0) + 1
              print(f"Updated trusted contributor {author}")

          else:
              # Handle regular contributors
              contributors = data.get('contributors') or []
              data['contributors'] = contributors

              # Find existing contributor
              contributor = None
              for c in contributors:
                  if isinstance(c, dict) and c.get('github') == author:
                      contributor = c
                      break

              if contributor:
                  update_contributor(contributor)
                  contributor['prs_merged'] = contributor.get('prs_merged', 0) + 1

                  if is_substantive:
                      contributor['substantive_prs'] = contributor.get('substantive_prs', 0) + 1
                      if not contributor.get('checkmark'):
                          contributor['checkmark'] = True
                          contributor['checkmark_pr'] = pr_number
                          print(f"Granted checkmark to {author}")

                  print(f"Updated contributor {author}")

              else:
                  # New contributor
                  abs_commits = get_absolute_commit_count(author)
                  new_contributor = {
                      'github': author,
                      'joined': current_month,
                      'checkmark': is_substantive,
                      'topics': topics,
                      'last_active': current_month,
                      'prs_merged': 1,
                      'substantive_prs': 1 if is_substantive else 0,
                      'contributions': [dict(c, pr=pr_number) for c in contributions],
                      'total_citations': total_citations,
                      'commits': abs_commits if abs_commits is not None else commits
                  }
                  if is_substantive:
                      new_contributor['checkmark_pr'] = pr_number

                  contributors.append(new_contributor)
                  print(f"Added new contributor {author}" + (" with checkmark" if is_substantive else ""))

          # Write updated yaml
          with open('contributors.yaml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False, sort_keys=False, allow_unicode=True)

          PYTHON_SCRIPT

      - name: Generate CONTRIBUTORS.md
        if: steps.analyze.outputs.has_content == 'true'
        run: |
          python << 'PYTHON_SCRIPT'
          import yaml
          import urllib.parse

          with open('contributors.yaml', 'r') as f:
              data = yaml.safe_load(f) or {}

          topic_labels = {
              'heart-health': 'Cardiology',
              'cardiology': 'Cardiology',
              'Womens-Health': "Women's Health",
              'exercise-physiology': 'Exercise Physiology',
              'musculoskeletal-health': 'Musculoskeletal',
              'dermatology': 'Dermatology',
              'endocrinology': 'Endocrinology',
          }

          def label_topic(topic):
              return topic_labels.get(topic, topic.replace('-', ' ').title())

          md = []
          all_verified = []  # Collect all verified for badge section
          maintainers = data.get('maintainers') or []
          trusted_entries = data.get('trusted') or []
          contributors_entries = data.get('contributors') or []

          md.append("# Contributors\n")
          md.append("This file is auto-generated from [contributors.yaml](contributors.yaml). Do not edit directly.\n")
          md.append("---\n")

          # Maintainers section
          md.append("## Maintainers\n")
          md.append("| | Name | Topics | Contributions | Citations | Commits | Last Active | Card |")
          md.append("|---|------|-----------|---------------|-----------|---------|-------------|------|")

          for m in maintainers:
              github = m.get('github', '')
              name = m.get('name', github)
              topics = m.get('topics', [])
              topics_str = ' '.join(f"`{label_topic(topic)}`" for topic in topics)
              contributions = m.get('contributions', [])
              contrib_links = ', '.join(f"[{c['file'].split('/')[-1]}]({c['file']})" for c in contributions[:3])
              if len(contributions) > 3:
                  contrib_links += f" +{len(contributions) - 3} more"
              if not contrib_links:
                  contrib_links = "-"
              total_citations = m.get('total_citations', 0)
              total_commits = m.get('commits', 0)
              last_active = m.get('last_active', '-')
              md.append(f"| <a id=\"{github}\"></a>⭐ | [@{github}](https://github.com/{github}) | {topics_str} | {contrib_links} | {total_citations} | {total_commits} | {last_active} | [View](cards/{github}.svg) |")
              all_verified.append({'github': github, 'type': 'maintainer', 'citations': total_citations, 'commits': total_commits, 'topics': topics})

          md.append("")

          # Trusted section
          trusted = [t for t in trusted_entries if isinstance(t, dict)]
          if trusted:
              md.append("---\n")
              md.append("## Trusted Contributors\n")
              md.append("| | Name | Topics | Contributions | Citations | Commits | Last Active | Card |")
              md.append("|---|------|--------|---------------|-----------|---------|-------------|------|")

              for t in trusted:
                  github = t.get('github', '')
                  name = t.get('name', github)
                  topics = t.get('topics', [])
                  topics_str = ' '.join(f"`{label_topic(top)}`" for top in topics)
                  contributions = t.get('contributions', [])
                  contrib_links = ', '.join(f"[{c['file'].split('/')[-1]}]({c['file']})" for c in contributions[:3])
                  if len(contributions) > 3:
                      contrib_links += f" +{len(contributions) - 3} more"
                  total_citations = t.get('total_citations', 0)
                  total_commits = t.get('commits', 0)
                  last_active = t.get('last_active', '-')
                  md.append(f"| <a id=\"{github}\"></a>✓ | [@{github}](https://github.com/{github}) | {topics_str} | {contrib_links} | {total_citations} | {total_commits} | {last_active} | [View](cards/{github}.svg) |")
                  all_verified.append({'github': github, 'type': 'trusted', 'citations': total_citations, 'commits': total_commits, 'topics': topics})

              md.append("")

          # Verified contributors
          contributors = [c for c in contributors_entries if isinstance(c, dict)]
          verified = [c for c in contributors if c.get('checkmark')]
          unverified = [c for c in contributors if not c.get('checkmark')]

          if verified:
              md.append("---\n")
              md.append("## Verified Contributors\n")
              md.append("| | Name | Topics | Contributions | Citations | Commits | Last Active | Card |")
              md.append("|---|------|--------|---------------|-----------|---------|-------------|------|")

              for c in verified:
                  github = c.get('github', '')
                  topics = c.get('topics', [])
                  topics_str = ' '.join(f"`{label_topic(top)}`" for top in topics)
                  contributions = c.get('contributions', [])
                  contrib_links = ', '.join(f"[{cont['file'].split('/')[-1]}]({cont['file']})" for cont in contributions[:3])
                  if len(contributions) > 3:
                      contrib_links += f" +{len(contributions) - 3} more"
                  if not contrib_links:
                      contrib_links = f"[View PRs](https://github.com/FreeGym/FreeGym-Wiki/pulls?q=author:{github})"
                  total_citations = c.get('total_citations', 0)
                  total_commits = c.get('commits', 0)
                  last_active = c.get('last_active', '-')
                  md.append(f"| <a id=\"{github}\"></a>✓ | [@{github}](https://github.com/{github}) | {topics_str} | {contrib_links} | {total_citations} | {total_commits} | {last_active} | [View](cards/{github}.svg) |")
                  all_verified.append({'github': github, 'type': 'contributor', 'citations': total_citations, 'commits': total_commits, 'topics': topics})

              md.append("")

          # Unverified contributors
          if unverified:
              md.append("---\n")
              md.append("## Contributors\n")
              md.append("These contributors have merged PRs but haven't yet earned verification.\n")
              md.append("| Name | Last Active | PRs |")
              md.append("|------|-------------|-----|")

              for c in unverified:
                  github = c.get('github', '')
                  last_active = c.get('last_active', '-')
                  prs = c.get('prs_merged', 0)
                  md.append(f"| <a id=\"{github}\"></a>[@{github}](https://github.com/{github}) | {last_active} | [{prs} PRs](https://github.com/FreeGym/FreeGym-Wiki/pulls?q=author:{github}) |")

              md.append("")

          md.append("---\n")
          md.append("**Want to get verified?** See [VERIFICATION.md](VERIFICATION.md) for how to earn the checkmark.\n")

          # Badge section for verified contributors
          if all_verified:
              md.append("---\n")
              md.append("## Your Badges\n")
              md.append("Copy these to your GitHub profile README to show your verification status.\n")

              for v in all_verified:
                  github = v['github']
                  citations = v['citations']
                  topics = v['topics']
                  vtype = v['type']

                  md.append(f"\n### @{github}\n")
                  md.append("```markdown")

                  # Main verification badge
                  profile_url = f"https://github.com/FreeGym/FreeGym-Wiki/blob/main/CONTRIBUTORS.md#{github}"
                  if vtype == 'maintainer':
                      badge_label = "FreeGym_Wiki-⭐_Maintainer"
                      badge_color = "gold"
                  else:
                      badge_label = "FreeGym_Wiki-✓_Verified"
                      badge_color = "red"

                  md.append(f"[![FreeGym Verified](https://img.shields.io/badge/{urllib.parse.quote(badge_label, safe='')}-{badge_color})]({profile_url})")

                  # Citations badge
                  if citations > 0:
                      md.append(f"[![Citations](https://img.shields.io/badge/Citations-{citations}-blue)]({profile_url})")

                  # Topic badges
                  for topic in topics:
                      topic_label = label_topic(topic)
                      topic_encoded = urllib.parse.quote(topic_label, safe='')
                      md.append(f"[![{topic_label}](https://img.shields.io/badge/Topic-{topic_encoded}-green)]({profile_url})")

                  md.append("```\n")

                  # Shareable card
                  md.append("**Shareable Card:**\n")
                  md.append(f"![Profile Card](https://raw.githubusercontent.com/FreeGym/FreeGym-Wiki/main/cards/{github}.svg)\n")
                  md.append(f"Direct link: `https://raw.githubusercontent.com/FreeGym/FreeGym-Wiki/main/cards/{github}.svg`\n")

          with open('CONTRIBUTORS.md', 'w') as f:
              f.write('\n'.join(md))

          print("Generated CONTRIBUTORS.md")

          PYTHON_SCRIPT

      - name: Generate SVG profile cards
        if: steps.analyze.outputs.has_content == 'true'
        run: python .github/scripts/generate_cards.py

      - name: Create or update contributor PR
        if: steps.analyze.outputs.has_content == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Contributor Tracker"
          git add contributors.yaml CONTRIBUTORS.md cards/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Get PR info for branch naming and commit message
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr_number="${{ inputs.pr_number }}"
          else
            pr_number="${{ github.event.pull_request.number }}"
          fi
          author=$(python - <<'PYTHON_SCRIPT'
          import json
          with open('pr_analysis.json', 'r') as f:
              print(json.load(f).get('author', ''))
          PYTHON_SCRIPT
          )

          git commit -m "Update contributors: $author (PR #${pr_number})"

          # Use a single rolling branch to avoid branch sprawl
          branch_name="contributor-update/auto"
          git checkout -B "$branch_name"
          git push origin "$branch_name" --force

          # Check if a PR already exists for this branch
          existing_pr=$(gh pr list --head "$branch_name" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists for this branch, updated."
          else
            # Create a new PR with inline body
            gh pr create \
              --title "chore: Update contributor stats for PR #${pr_number}" \
              --body "Auto-generated by Contributor Tracker. Updates contributors.yaml, CONTRIBUTORS.md, and cards/ for PR #${pr_number} by @${author:-Unknown}." \
              --base main \
              --head "$branch_name"
          fi
